# Version updates are batched twice a year: everything here is a dev
# dependency or a CI action, nothing ships to users. Security updates are
# independent of this schedule and arrive as soon as a vulnerability is known.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: semiannually
    groups:
      dev-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: semiannually
    groups:
      actions:
        patterns: ["*"]
