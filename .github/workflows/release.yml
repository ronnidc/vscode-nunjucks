name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "package.json is $version but the tag is ${GITHUB_REF_NAME}"
            exit 1
          fi
      - run: npm run lint
      - run: npm run test:grammar
      - run: xvfb-run -a npm run test:integration
      - run: npx vsce package
      - name: Publish to Visual Studio Marketplace
        # The gallery API now and then stops answering and the HTTP client
        # gives up after a fixed three minutes (microsoft/vscode#336278), so
        # try a few times. --skip-duplicate makes an attempt after one that
        # did get through server-side a no-op, and lets a rerun of the job
        # continue to Open VSX and the GitHub release after a manual upload.
        run: |
          for attempt in 1 2 3; do
            npx vsce publish --packagePath *.vsix --skip-duplicate && exit 0
            echo "::warning::vsce publish attempt $attempt failed, retrying in 60 seconds"
            sleep 60
          done
          exit 1
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        # The namespace must exist before the first publish. Creating it is
        # idempotent enough: the command fails when it already exists, which
        # is the normal case, so its exit code is ignored. Open VSX is the
        # secondary registry, so a failure here must not block the GitHub
        # release; the step shows as failed and can be rerun on its own.
        continue-on-error: true
        run: |
          npx ovsx create-namespace ronnidc || true
          npx ovsx publish *.vsix --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: "*.vsix"
          generate_release_notes: true
